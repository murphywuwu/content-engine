<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasySociable · Observatory</title>
  <link rel="stylesheet" href="css/workbench.css" />

</head>
<body>
  <div class="serve-banner" id="serveBanner"></div>

  <!-- Compatibility dummy nodes for legacy queries -->
  <div id="tabs" style="display:none;" aria-hidden="true"></div>
  <div id="workspaceNav" style="display:none;" aria-hidden="true"></div>

  <div class="app-root">
    <!-- Top Navigation (Two Decks) -->
    <header class="studio-topbar">
      <!-- Deck 1: Brand & Global Tools -->
      <div class="topbar-deck-primary">
        <div class="deck-left">
          <a class="brand-cluster" href="https://easysociable.com" target="_blank" rel="noopener noreferrer" title="EasySociable">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="currentColor">
                <g transform="rotate(-20 16 27)">
                  <rect x="10" y="7" width="12" height="18.5" rx="2.3" opacity="0.4" />
                </g>
                <g transform="rotate(20 16 27)">
                  <rect x="10" y="7" width="12" height="18.5" rx="2.3" opacity="0.4" />
                </g>
                <rect x="10" y="5.2" width="12" height="21" rx="2.3" />
              </svg>
            </span>
            <span class="brand-info">
              <span class="brand-title">EasySociable</span>
              <span class="brand-badge" id="brandBadge">只读镜子</span>
            </span>
          </a>
          <div class="profile-cluster">
            <select id="profileSel" aria-label="IP Profile" title="切换当前聚焦的 IP Profile"></select>
          </div>
        </div>

        <div class="deck-center">
          <div class="search-box">
            <input id="q" type="search" placeholder="⌘K 搜索全库内容、选题、判断与实体..." autocomplete="off" />
            <span class="search-kbd" id="searchKbd">⌘K</span>
            <button type="button" class="search-clear" id="qClear" title="清空搜索">✕</button>
          </div>
        </div>

        <div class="deck-right">
          <button type="button" class="deck-tool-btn" id="themeBtn" title="切换深色/浅色模式">🌙</button>
          <button type="button" class="deck-tool-btn on" id="inspToggleBtn" title="折叠/展开检查器抽屉">◧</button>
          <button type="button" class="deck-tool-btn" id="langBtn">EN</button>
          <div class="sync-indicator" title="Obsidian Vault 实时同步就绪">
            <span class="sync-dot"></span>
            <span class="stamp" id="stamp"></span>
          </div>
        </div>
      </div>

      <!-- Deck 2: Three words only -->
      <div class="topbar-deck-nav">
        <nav class="studio-nav" id="studioNav" aria-label="主导航">
          <div class="nav-primary">
            <button type="button" class="nav-tab on" data-v="overview">
              <span class="nav-tab-text" id="lbl-overview">现在</span>
            </button>
            <button type="button" class="nav-tab" data-v="select">
              <span class="nav-tab-text" id="lbl-select">选题</span>
              <span class="nav-tab-badge" id="badge-select">0</span>
            </button>
            <button type="button" class="nav-tab" data-v="content">
              <span class="nav-tab-text" id="lbl-content">生产</span>
              <span class="nav-tab-badge" id="badge-content">0</span>
            </button>
            <button type="button" class="nav-tab" data-v="shipped">
              <span class="nav-tab-text" id="lbl-shipped">学习</span>
              <span class="nav-tab-badge" id="badge-shipped">0</span>
            </button>
            <button type="button" class="nav-tab" data-v="base">
              <span class="nav-tab-text" id="lbl-base">底座</span>
              <span class="nav-tab-badge" id="badge-base">0</span>
            </button>
            <button type="button" class="nav-tab" data-v="brand">
              <span class="nav-tab-text" id="lbl-brand">品牌</span>
            </button>
            <button type="button" class="nav-tab" data-v="media">
              <span class="nav-tab-text" id="lbl-media">图库</span>
              <span class="nav-tab-badge" id="badge-media">0</span>
            </button>
          </div>
          <div class="nav-more-wrap">
            <button type="button" class="nav-tab" id="searchFocusBtn" title="搜索全库">
              <span class="nav-tab-text" id="lbl-find">查找</span>
            </button>
            <button type="button" class="nav-tab" id="moreNavBtn" aria-haspopup="true" aria-expanded="false">
              <span class="nav-tab-text" id="lbl-more">全部页面</span>
              <span class="nav-tab-caret">▾</span>
            </button>
            <div class="more-menu" id="moreMenu"></div>
          </div>
        </nav>
      </div>
    </header>

    <!-- Stage Shell (Stage List + Inspector Drawer) -->
    <div class="shell" id="shell">
      <section class="list" id="list"></section>
      <aside class="insp" id="insp">
        <div class="empty"><strong>还没有选中东西</strong>从上方（现在 / 选题 / 生产 / 学习 / 底座）或「全部页面」点开一件，也可以用 ⌘K 查找。真正要改内容，去跟 Agent 说话。</div>
      </aside>
    </div>
  </div>
  <div class="ctx-modal" id="ctxModal" role="dialog" aria-modal="true" aria-labelledby="ctxTitle">
    <div class="ctx-sheet" id="ctxSheet">
      <div class="ctx-head">
        <div>
          <h2 id="ctxTitle"></h2>
          <p id="ctxLede"></p>
        </div>
        <button type="button" id="ctxClose" aria-label="Close">✕</button>
      </div>
      <div class="ctx-tabs" id="ctxTabs" hidden>
        <button type="button" class="ctx-tab on" data-ctx-tab="graph" id="ctxTabGraph"></button>
        <button type="button" class="ctx-tab" data-ctx-tab="prompt" id="ctxTabPrompt"></button>
      </div>
      <div class="ctx-body" id="ctxBodyGraph">
        <div class="ctx-map" id="ctxMap"></div>
        <aside class="ctx-detail" id="ctxDetail"></aside>
      </div>
      <div class="ctx-prompt" id="ctxPrompt" hidden></div>
    </div>
  </div>
  <div class="md-modal" id="mdModal" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <div class="md-sheet" id="mdSheet">
      <div class="md-head">
        <div class="md-head-copy">
          <h2 class="md-title" id="mdTitle"></h2>
          <span class="md-sub" id="mdSub"></span>
        </div>
        <button type="button" id="mdClose" aria-label="Close">✕</button>
      </div>
      <div class="md-layout">
        <nav class="md-rail" id="mdRail" aria-label="stages"></nav>
        <div class="md-main">
          <div class="md-toolbar">
            <span class="md-path" id="mdPath"></span>
          </div>
          <div class="md-body" id="mdBody"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    let GRAPH = /*__GRAPH__*/null;
    if (!GRAPH || !Array.isArray(GRAPH.nodes)) {
      GRAPH = {
        generated_at: "",
        nodes: [],
        edges: [],
        profiles: [],
        keywords: [],
        media: [],
        pillars: {},
        pillars_by_profile: {},
      };
    }
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
