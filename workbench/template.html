<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasySociable · Observatory</title>
  <style>
:root {
      /* Modern Studio Minimalist Light Theme */
      --ink: #0f172a;
      --bg: #f8fafc;
      --bg-2: #f1f5f9;
      --bg-3: #e2e8f0;
      --bg-1: #ffffff;
      --paper: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --faint: #94a3b8;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --accent: #2563eb;
      --accent-dim: #1d4ed8;
      --accent-faint: rgba(37, 99, 235, 0.08);
      --accent-subtle: #eff6ff;
      --gap: #ef4444;
      --gap-bg: #fef2f2;
      --ok: #10b981;
      --ok-bg: #ecfdf5;
      --warn: #f59e0b;
      --warn-bg: #fffbeb;
      --chip: #f1f5f9;
      --chip-text: #334155;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --glow: rgba(37, 99, 235, 0.04);
      --sumi: #0f172a;
      --glass: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(226, 232, 240, 0.8);
      --graph-link: #cbd5e1;
      --graph-node-stroke: #ffffff;
      --modal-backdrop: rgba(15, 23, 42, 0.45);
    }

    [data-theme="dark"] {
      /* Obsidian Dark Precision Theme */
      --ink: #f8fafc;
      --bg: #090d16;
      --bg-2: #0f172a;
      --bg-3: #1e293b;
      --bg-1: #131d2e;
      --paper: #131d2e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --faint: #64748b;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #38bdf8;
      --accent-dim: #0284c7;
      --accent-faint: rgba(56, 189, 248, 0.12);
      --accent-subtle: rgba(56, 189, 248, 0.08);
      --gap: #f87171;
      --gap-bg: rgba(239, 68, 68, 0.15);
      --ok: #34d399;
      --ok-bg: rgba(16, 185, 129, 0.15);
      --warn: #fbbf24;
      --warn-bg: rgba(245, 158, 11, 0.15);
      --chip: #1e293b;
      --chip-text: #cbd5e1;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow: 0 6px 20px -2px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      --glow: rgba(56, 189, 248, 0.06);
      --sumi: #38bdf8;
      --glass: rgba(13, 19, 31, 0.92);
      --glass-border: rgba(30, 41, 59, 0.8);
      --graph-link: #334155;
      --graph-node-stroke: #131d2e;
      --modal-backdrop: rgba(0, 0, 0, 0.75);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

    button { font: inherit; }
    a { color: var(--accent); text-decoration: none; transition: color .15s ease; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* Root App Layout */
    .app-root {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    /* Top Navigation (2 Decks: Global Master + Functional Modules) */
    .studio-topbar {
      display: flex;
      flex-direction: column;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      z-index: 50;
      flex-shrink: 0;
    }

    /* Deck 1: Master Brand & Global Tools */
    .topbar-deck-primary {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      gap: 16px;
    }
    .deck-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 9px;
      user-select: none;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
      padding: 4px 6px 4px 4px;
      margin: -4px -6px -4px -4px;
      transition: background .15s ease;
    }
    .brand-cluster:hover {
      background: color-mix(in srgb, var(--bg-2) 80%, transparent);
    }
    .brand-cluster:hover .brand-title { color: var(--accent); }
    .brand-mark {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #0c0b0a;
      color: #ede6d6;
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
    }
    .brand-mark svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    [data-theme="dark"] .brand-mark {
      background: #ede6d6;
      color: #0c0b0a;
    }
    .brand-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 750;
      color: var(--text);
      letter-spacing: -0.02em;
      transition: color .15s ease;
    }
    .brand-badge {
      font-size: 10px;
      color: var(--faint);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .profile-cluster select {
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all .15s ease;
    }
    .profile-cluster select:hover {
      background: var(--bg-3);
      border-color: var(--line-strong);
    }

    .deck-center {
      flex: 1;
      display: flex;
      justify-content: center;
      max-width: 480px;
    }
    .search-box {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .search-box::before {
      content: "";
      position: absolute;
      left: 10px;
      width: 11px;
      height: 11px;
      border: 1.5px solid var(--faint);
      border-radius: 50%;
      pointer-events: none;
    }
    .search-box::after {
      content: "";
      position: absolute;
      left: 19px;
      width: 5px;
      height: 1.5px;
      background: var(--faint);
      transform: rotate(45deg);
      pointer-events: none;
      margin-top: 9px;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 5px 30px 5px 28px;
      border-radius: 7px;
      outline: none;
      font-size: 12px;
      transition: all .15s ease;
    }
    .search-box input:focus {
      background: var(--paper);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-faint);
    }
    .search-kbd {
      position: absolute;
      right: 8px;
      font-size: 9.5px;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--faint);
      background: var(--bg-3);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid var(--line);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 0;
      background: var(--bg-3);
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .deck-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .deck-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s ease;
    }
    .deck-tool-btn:hover {
      background: var(--bg-3);
      border-color: var(--line-strong);
      color: var(--text);
      text-decoration: none;
    }
    .deck-tool-btn.on {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent);
    }
    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-left: 8px;
      border-left: 1px solid var(--line);
      font-size: 11px;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--faint);
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 2px var(--ok-bg);
    }

    /* Deck 2: Task-first navigation */
    .topbar-deck-nav {
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg);
    }
    .topbar-deck-nav::-webkit-scrollbar { display: none; }

    .studio-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .nav-cluster {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .nav-primary {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .nav-more-wrap {
      position: relative;
      margin-left: auto;
      flex-shrink: 0;
    }
    .more-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 220px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      padding: 6px;
      z-index: 80;
    }
    .more-menu.open { display: grid; gap: 2px; }
    .more-menu button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }
    .more-menu button:hover,
    .more-menu button.on {
      background: var(--accent-subtle);
      color: var(--accent-dim);
    }
    .more-menu .more-count {
      font-size: 11px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    .cluster-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--faint);
      padding: 2px 7px;
      user-select: none;
    }
    .hub-page { max-width: 980px; }
    .hub-hero { margin: 0 0 22px; }
    .hub-kicker {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .hub-title {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }
    .hub-desc {
      margin: 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: 14.5px;
    }
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 0 0 22px;
    }
    .hub-section-title {
      margin: 6px 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--faint);
    }
    /* Base tab — Asset Library Grid & Cards */
    .base-group {
      margin: 0 0 24px;
    }
    .base-group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .base-group-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .base-group-kicker {
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
    }
    .base-group-title {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 0;
    }
    .base-group-why {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      max-width: 50ch;
    }
    .base-shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }
    .asset-shelf-card {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 16px 16px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      position: relative;
    }
    .asset-shelf-card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .asset-shelf-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .asset-shelf-info {
      min-width: 0;
      flex: 1;
    }
    .asset-shelf-name {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.01em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .asset-shelf-desc {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .asset-shelf-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .asset-shelf-badge {
      font-size: 12px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .asset-shelf-open {
      font-size: 12px;
      font-weight: 650;
      color: var(--accent-dim);
      background: var(--accent-subtle);
      border: 1px solid transparent;
      padding: 3px 9px;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      transition: all .15s ease;
    }
    .asset-shelf-open:hover {
      background: var(--accent);
      color: #fff;
    }
    .asset-preview-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .asset-preview-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg-2) 65%, var(--paper));
      border: 1px solid var(--line);
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: left;
      width: 100%;
      transition: all .15s ease;
    }
    .asset-preview-item:hover {
      background: var(--paper);
      border-color: var(--accent);
      box-shadow: 0 1px 4px rgba(37,99,235,.08);
      transform: translateX(2px);
    }
    .asset-item-tag {
      font-size: 11px;
      font-weight: 750;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--accent-dim);
      background: var(--accent-subtle);
      padding: 2px 6px;
      border-radius: 5px;
    }
    .asset-item-text {
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .asset-item-arrow {
      color: var(--faint);
      font-size: 13px;
      transition: transform .15s ease, color .15s ease;
    }
    .asset-preview-item:hover .asset-item-arrow {
      color: var(--accent);
      transform: translateX(2px);
    }
    .asset-shelf-empty {
      padding: 12px 14px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--bg-2);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .funnel-lane {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 16px 18px 14px;
      margin: 0 0 14px;
      box-shadow: var(--shadow-sm);
    }
    .funnel-lane-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
    }
    .funnel-lane-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }
    .funnel-step {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-subtle);
      color: var(--accent-dim);
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
      margin-top: 1px;
    }
    .funnel-lane-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .funnel-lane-desc {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .funnel-lane-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .funnel-lane-count {
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .funnel-lane-hint {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-dim);
      background: var(--accent-subtle);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .funnel-items {
      display: grid;
      gap: 6px;
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .funnel-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-2, var(--bg));
      cursor: pointer;
      border: 1px solid transparent;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .funnel-item:hover {
      border-color: var(--accent);
      background: var(--paper);
    }
    .funnel-item-id {
      font-size: 11px;
      font-weight: 700;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    .funnel-item-label {
      font-size: 13px;
      color: var(--text);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .funnel-item-go { color: var(--faint); font-size: 14px; }
    .funnel-empty {
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--faint);
    }
    .funnel-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .funnel-footer .ghost-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-dim);
      background: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      padding: 4px 0;
    }
    .topic-board, .decision-board { display: grid; gap: 10px; margin-top: 8px; }
    .topic-card, .decision-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color .15s ease, box-shadow .15s ease;
      position: relative;
    }
    .topic-card {
      padding-left: 18px;
    }
    .topic-card::before {
      content: "";
      position: absolute;
      left: 0; top: 10px; bottom: 10px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--line);
    }
    .topic-card.is-wait {
      border-color: #e8c48a;
      background: linear-gradient(180deg, #fffbf3 0%, var(--paper) 48%);
    }
    .topic-card.is-wait::before { background: #d97706; }
    .topic-card.is-open {
      border-color: var(--line);
      background: var(--bg-2, #f6f5f2);
      opacity: 0.92;
    }
    .topic-card.is-open::before { background: #059669; }
    .topic-card.is-open .topic-card-title { color: var(--muted); font-weight: 600; }
    .topic-card:hover, .topic-card.sel,
    .decision-card:hover, .decision-card.sel {
      border-color: var(--accent);
      box-shadow: var(--shadow);
      opacity: 1;
    }
    .topic-card-title, .decision-card-quote {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.45;
    }
    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      border-radius: 999px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .topic-badge.wait {
      background: #fff4e5;
      color: #9a3412;
      border: 1px solid #f0c48a;
    }
    .topic-badge.open {
      background: #e8f5ec;
      color: #166534;
      border: 1px solid #a7d4b5;
    }
    .topic-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .topic-card-hint {
      margin: 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }
    .topic-card.is-wait .topic-card-hint { color: #9a3412; }
    .topic-card.is-open .topic-card-hint { color: #166534; }
    .decision-card-quote {
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .decision-card-kicker {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .topic-card-meta, .decision-card-meta {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .topic-card-tags, .decision-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .topic-card-tags .pill, .decision-card-tags .pill {
      font-size: 11px;
    }
    .pill.triage, .pill.gap.triage { background: #fff4e5; color: #8a4f00; }
    .pill.ready, .pill.ok.ready { background: #e8f5ec; color: #20572b; }
    .topic-card-side, .decision-card-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .topic-card-score, .decision-card-status {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      text-align: right;
      max-width: 88px;
    }
    .topic-card-score {
      font-size: 18px;
      font-variant-numeric: tabular-nums;
    }
    .topic-card-id, .decision-card-id {
      font-size: 11px;
      font-weight: 600;
      color: var(--faint);
    }
    .decision-card .heat { margin-top: 8px; }
    .page-back {
      margin: 0 0 10px;
    }
    .page-back button {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-dim);
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }
    .wiki-surface-tabs { margin-bottom: 10px; }
    .hub-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .hub-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .hub-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hub-card-icon { font-size: 18px; }
    .hub-card-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-subtle);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .hub-card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .hub-card-desc {
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      flex: 1;
    }
    .hub-card-cta {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .next-list {
      display: grid;
      gap: 8px;
      margin: 0 0 22px;
    }
    .next-item, .status-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .next-item {
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .next-item:hover {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
    .next-item-main { min-width: 0; }
    .next-item-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 700;
    }
    .next-item-meta {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .next-item-action {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin: 0 0 22px;
    }
    .status-card {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 12px;
      padding: 14px;
    }
    .status-card .label {
      display: block;
      margin: 0 0 6px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status-card .value {
      display: block;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.03em;
    }
    .status-card .hint {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -0.02em;
    }
    .section-head button {
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .say-card {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow-sm);
      margin: 0 0 18px;
    }
    .say-kicker {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .say-title {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.03em;
    }
    .say-meta {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
      max-width: 64ch;
    }
    .stage-rail {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 16px;
    }
    .stage-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--bg-2);
      color: var(--faint);
      border: 1px solid var(--line);
    }
    .stage-pill.done {
      color: var(--ok);
      background: var(--ok-bg);
      border-color: transparent;
    }
    .stage-pill.now {
      color: var(--accent-dim);
      background: var(--accent-subtle);
      border-color: transparent;
    }
    .say-box {
      display: flex;
      align-items: stretch;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }
    .say-box code {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text);
      padding: 6px 8px;
    }
    .say-box button {
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 0 14px;
      cursor: pointer;
    }
    .say-box button:hover { filter: brightness(1.05); }

    /* Now desk — one decision, editorial focus */
    .now-desk {
      max-width: 840px;
      margin: 0 auto;
      animation: nowIn .45s ease both;
    }
    @keyframes nowIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .now-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .now-greeting {
      margin: 0;
      font-size: 11.5px;
      font-weight: 750;
      color: var(--accent-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .now-date {
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.1;
      color: var(--text);
    }
    .now-pulse {
      display: grid;
      grid-auto-flow: column;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: var(--shadow-sm);
    }
    .now-pulse-chip {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      min-width: 82px;
      padding: 8px 14px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      font: inherit;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .now-pulse-chip:last-child { border-right: 0; }
    .now-pulse-chip:hover { background: var(--bg-2); color: var(--text); }
    .now-pulse-chip b {
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .now-pulse-chip span {
      font-size: 10.5px;
      color: var(--faint);
    }

    /* Focus Card — compact command center */
    .now-focus {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px 14px;
      background:
        radial-gradient(100% 80% at 100% -20%, var(--now-glow, rgba(37,99,235,.08)) 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, color-mix(in srgb, var(--bg-2) 30%, var(--paper)) 100%);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin: 0 0 24px;
    }
    .now-focus::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3.5px;
      background: var(--now-rail, var(--accent));
    }
    .now-focus.mode-write { --now-rail: #2563eb; --now-glow: rgba(37,99,235,.10); }
    .now-focus.mode-decide { --now-rail: #d97706; --now-glow: rgba(217,119,6,.12); }
    .now-focus.mode-review { --now-rail: #059669; --now-glow: rgba(5,150,105,.10); }
    .now-focus.mode-start { --now-rail: #64748b; --now-glow: rgba(100,116,139,.10); }

    .now-focus-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .now-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: var(--now-rail, var(--accent-dim));
    }
    .now-focus.mode-write .now-badge { color: #1d4ed8; }
    .now-focus.mode-decide .now-badge { color: #b45309; }
    .now-focus.mode-review .now-badge { color: #047857; }
    .now-focus.mode-start .now-badge { color: #64748b; }
    .now-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      animation: nowPulse 1.8s ease infinite;
    }
    @keyframes nowPulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 35%, transparent); }
      50% { box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 0%, transparent); }
    }
    .now-focus-action .ghost-link {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent-dim);
      background: var(--accent-subtle);
      border: 1px solid transparent;
      padding: 3px 10px;
      border-radius: 7px;
      cursor: pointer;
      font: inherit;
      transition: all .15s ease;
    }
    .now-focus-action .ghost-link:hover {
      background: var(--accent);
      color: #fff;
    }

    .now-focus .say-title {
      margin: 0 0 4px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: var(--text);
    }
    .now-why {
      margin: 0 0 6px;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--muted);
      max-width: 56ch;
    }
    .now-focus .say-meta {
      margin: 0 0 8px;
      font-size: 11.5px;
      color: var(--faint);
    }
    .now-say-block {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .now-say-label {
      flex-shrink: 0;
      font-size: 10.5px;
      font-weight: 750;
      color: var(--faint);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
    }
    .now-focus .say-box {
      flex: 1;
      min-width: 0;
      background: color-mix(in srgb, var(--bg-2) 60%, var(--paper));
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .now-focus .say-box code {
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .now-focus .say-box button {
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      border: 0;
      cursor: pointer;
      flex-shrink: 0;
      transition: filter .15s ease;
    }
    .now-focus .say-box button:hover { filter: brightness(1.1); }

    /* The Loop & Base — Large Tactile Cards */
    .now-map {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .now-map-head {
      margin: 0 0 16px;
    }
    .now-map-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .now-goto-label {
      margin: 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .now-map-subbadge {
      font-size: 11px;
      font-weight: 650;
      color: var(--accent-dim);
      background: var(--accent-subtle);
      border: 1px solid transparent;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }
    .now-map-hint {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
      max-width: 58ch;
    }
    .now-map-flow {
      display: grid;
      grid-template-columns: 1fr 28px 1fr 28px 1fr;
      align-items: stretch;
      gap: 0;
    }
    .now-map-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--line-strong);
      position: relative;
    }
    .now-map-arrow svg {
      color: var(--muted);
      opacity: .6;
      transition: transform .18s ease, opacity .18s ease;
    }
    .now-door {
      appearance: none;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 18px 16px;
      background:
        radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--door-tone, var(--accent)) 6%, transparent) 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, color-mix(in srgb, var(--bg-2) 40%, var(--paper)) 100%);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font: inherit;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 162px;
      position: relative;
      overflow: hidden;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .now-door::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3.5px;
      background: var(--door-tone, var(--accent));
      opacity: .9;
    }
    .now-door:hover {
      border-color: color-mix(in srgb, var(--door-tone, var(--accent)) 50%, var(--line));
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .now-door:hover .now-door-foot span {
      color: var(--door-tone, var(--accent));
      transform: translateX(3px);
    }
    .now-door.tone-select { --door-tone: #2563eb; }
    .now-door.tone-produce { --door-tone: #0f766e; }
    .now-door.tone-learn { --door-tone: #b45309; }
    .now-door.tone-base { --door-tone: #475569; }

    .now-door-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .now-door-step {
      font-size: 11.5px;
      font-weight: 750;
      letter-spacing: 0.06em;
      color: var(--door-tone, var(--accent-dim));
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .now-door-step .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .now-door-count {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 8px;
    }
    .now-door-count b {
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }
    .now-door-count small {
      font-size: 11px;
      color: var(--faint);
      font-weight: 600;
    }
    .now-door-title {
      margin: 8px 0 2px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .now-door-role {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--muted);
      flex: 1;
    }
    .now-door-foot {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .now-door-foot span {
      font-size: 12px;
      font-weight: 700;
      color: var(--faint);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all .15s ease;
    }

    /* Bridge to Base */
    .now-map-bridge {
      height: 32px;
      margin: 0 10%;
      border-left: 1px solid var(--line-strong);
      border-right: 1px solid var(--line-strong);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .85;
    }
    .now-map-bridge::before {
      content: "";
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px;
      background: var(--line-strong);
      transform: translateX(-50%);
    }
    .now-bridge-badge {
      position: relative;
      z-index: 2;
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--bg);
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    /* Foundation Door */
    .now-door-base {
      min-height: 104px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      background:
        radial-gradient(100% 120% at 100% 0%, rgba(71,85,105,.08) 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, color-mix(in srgb, var(--bg-2) 45%, var(--paper)) 100%);
      border: 1px solid var(--line-strong);
      border-radius: 16px;

    .now-door-base::before {
      width: 4px;
      height: 100%;
      top: 0; bottom: 0; left: 0;
      background: #475569;

    .now-door-base-copy {

      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;

    .now-door-base .now-door-title { margin: 0; font-size: 17px; }
    .now-door-base .now-door-role { max-width: 46ch; }
    .now-door-base-side {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .now-door-base-pills {

      flex-wrap: wrap;
      gap: 6px;
      max-width: 220px;
      justify-content: flex-end;

    .base-pill-tag {

      font-weight: 650;

      padding: 2px 7px;

    .now-door-base-mark {
      font-size: 12px;
      font-weight: 750;
      color: #475569;
      border: 1px solid var(--line-strong);

      padding: 6px 12px;
      background: var(--bg-2);
      white-space: nowrap;
      transition: all .15s ease;
