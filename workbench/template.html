<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Engine · 观察台</title>
  <style>
    :root {
      --ink: #2c2822;
      --bg: #f4ecdc;
      --bg-2: #efe6d2;
      --bg-3: #e5d9c0;
      --paper: #faf6ec;
      --text: #2c2822;
      --muted: #6e675c;
      --faint: #8a8276;
      --line: #d4c6a8;
      --accent: #9c3d32;
      --accent-dim: #7a3028;
      --gap: #a14a38;
      --ok: #4a6750;
      --chip: #e8dcc4;
      --shadow: 0 12px 28px rgba(70, 50, 24, .08);
      --glow: #ead9b8;
      --gap-bg: #f6e6d6;
      --sumi: #2c2822;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background:
        radial-gradient(900px 420px at 12% -8%, var(--glow) 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font: 14px/1.5 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: .14; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    body::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: .045;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 5px,
        rgba(80, 60, 30, .35) 5px 6px
      );
    }
    button { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .tools { display: flex; align-items: center; gap: 8px; }
    .tools button, .tools select {
      background: var(--bg-3); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    #profileSel { max-width: 220px; }
    header.app {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 20px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 82%, transparent);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 168px; }
    .mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(145deg, #3a342c, #1e1b17);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      position: relative;
    }
    .mark::after {
      content: ""; position: absolute; inset: 8px 7px 8px 13px;
      border-right: 1.5px solid var(--paper); border-bottom: 1.5px solid var(--paper);
      opacity: .55;
    }
    header.app h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .04em; }
    header.app h1 small { display: block; color: var(--faint); font-weight: 400; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-top: 2px; }
    nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
    nav.tabs button, .subtabs button {
      background: transparent; border: 0; color: var(--muted);
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    nav.tabs button.on, .subtabs button.on {
      background: var(--sumi); color: var(--paper); font-weight: 600;
    }
    nav.tabs button:not(.on):hover { color: var(--text); background: var(--bg-3); }
    .search {
      position: relative;
    }
    .search::before {
      content: ""; position: absolute; left: 12px; top: 11px; width: 12px; height: 12px;
      border: 1.5px solid var(--faint); border-radius: 50%;
    }
    .search::after {
      content: ""; position: absolute; left: 22px; top: 21px; width: 6px; height: 1.5px;
      background: var(--faint); transform: rotate(45deg);
    }
    #q {
      width: 260px; background: var(--paper); border: 1px solid var(--line); color: var(--text);
      padding: 8px 12px 8px 32px; border-radius: 999px; outline: none;
    }
    #q:focus { border-color: var(--accent-dim); }
    .stamp { color: var(--faint); font-size: 11px; letter-spacing: .04em; }
    .shell { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(340px, .8fr); height: calc(100% - 61px); }
    .list { overflow: auto; padding: 28px 32px 56px; }
    .insp {
      overflow: auto; padding: 28px 26px 56px;
      background:
        linear-gradient(180deg, rgba(255,250,240,.5), transparent 140px),
        var(--bg-2);
      border-left: 1px solid var(--line);
    }
    .lead {
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif;
      font-size: 28px; line-height: 1.25; font-weight: 500; margin: 0 0 8px; max-width: 18em;
    }
    .lede { color: var(--muted); margin: 0 0 22px; max-width: 42em; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .filters select {
      background: var(--paper); border: 1.5px solid var(--line); color: var(--text);
      padding: 7px 28px 7px 12px; border-radius: 8px; min-width: 140px;
    }
    .filt {
      display: flex; flex-direction: column; gap: 14px;
      margin: 0 0 16px; padding: 14px 16px;
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    }
    .filt-row {
      display: flex; flex-direction: column; align-items: stretch; gap: 6px;
    }
    .filt-lab { font-size: 11px; color: var(--faint); letter-spacing: .08em; }
    .filt .subtabs {
      display: flex; flex-wrap: wrap; margin: 0; width: 100%;
      border-radius: 12px; gap: 2px;
    }
    .filt .subtabs button { white-space: nowrap; }
    .ghost-link {
      background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer;
      font: inherit; text-decoration: underline; text-underline-offset: 3px;
    }
    .cards { display: grid; gap: 10px; }
    .row {
      display: grid; grid-template-columns: 8px 1fr auto; gap: 14px;
      padding: 14px 16px 14px 0; background: var(--paper);
      border: 1px solid var(--line); border-radius: 14px;
      cursor: pointer; text-align: left; box-shadow: 0 1px 0 rgba(255,255,255,.55) inset;
    }
    .row:hover { border-color: #b8a888; transform: translateY(-1px); }
    .row.sel { border-color: var(--accent); box-shadow: var(--shadow); }
    .stripe { border-radius: 14px 0 0 14px; background: var(--accent-dim); }
    .row[data-kind="capture"] .stripe { background: #7d9aa8; }
    .row[data-kind="need"] .stripe { background: #5a9e8f; }
    .row[data-kind="raw"] .stripe { background: #6e7f6a; }
    .row[data-kind="topic"] .stripe { background: var(--accent); }
    .row[data-kind="swipe"] .stripe { background: #c4a06a; }
    .row[data-kind="atom"] .stripe { background: #a78bb0; }
    .row[data-kind="claim"] .stripe { background: #d08a78; }
    .row[data-kind="hit"] .stripe { background: #6b8f9e; }
    .row[data-kind="run"] .stripe { background: #8aa87a; }
    .row[data-kind="profile"] .stripe { background: #8b6b4a; }
    .row[data-kind="account"] .stripe { background: #5c6b7a; }
    .row[data-kind="wiki"] .stripe { background: #9c3d32; }
    .row[data-kind="media"] .stripe { background: #6b8f9e; }
    .row[data-kind="product"] .stripe { background: #7a6b9e; }
    .wiki-graph-wrap {
      margin: 0 0 18px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--paper); overflow: hidden; position: relative;
      box-shadow: var(--shadow);
    }
    .wiki-graph-toolbar button {
      background: var(--bg-3); border: 1px solid var(--line); color: var(--text);
      border-radius: 999px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12px;
    }
    .wiki-graph-toolbar button:hover { border-color: #b8a888; }
    .wiki-graph-toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg-2) 70%, var(--paper));
    }
    .wiki-graph-toolbar .wg-stat {
      margin-left: auto; font-family: ui-monospace, Menlo, monospace;
      font-size: 11px; color: var(--faint);
    }
    .wiki-graph-legend {
      display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 8px 12px 10px;
      border-bottom: 1px solid rgba(180,150,100,.25); font-size: 11px; color: var(--muted);
    }
    .wiki-graph-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .wiki-graph-legend i {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block;
      box-shadow: 0 0 0 1px rgba(0,0,0,.08);
    }
    .wiki-graph-svg { display: block; width: 100%; height: min(62vh, 620px); cursor: grab; touch-action: none; }
    .wiki-graph-svg.dragging { cursor: grabbing; }
    .wiki-graph-svg .link { stroke: #c7b58f; stroke-opacity: .72; fill: none; }
    .wiki-graph-svg .link-label {
      fill: var(--faint); font-size: 9px; font-family: ui-monospace, Menlo, monospace;
      pointer-events: none;
    }
    .wiki-graph-svg .node-label {
      fill: var(--text); font-size: 11px; pointer-events: none;
      font-family: "Iowan Old Style", "Songti SC", Georgia, serif;
    }
    .wiki-graph-svg .node-sub {
      fill: var(--faint); font-size: 9px; pointer-events: none;
      font-family: ui-monospace, Menlo, monospace;
    }
    .wiki-graph-svg .node { cursor: pointer; }
    .wiki-graph-svg .node.dim { opacity: .22; }
    .wiki-graph-svg .link.dim { opacity: .12; }
    .wiki-graph-svg .node.sel circle { stroke: var(--accent); stroke-width: 2.5px; }

    .heat {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px; align-items: center;
    }
    .heat-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-variant-numeric: tabular-nums;
      padding: 3px 8px; border-radius: 999px; white-space: nowrap;
      border: 1px solid transparent;
    }
    .heat-chip .sym { font-size: 10px; line-height: 1; opacity: .9; }
    .heat-chip .val { font-weight: 600; letter-spacing: .01em; }
    .heat-chip.likes { color: #a14a38; background: #f3ddd4; }
    .heat-chip.replies { color: #3d4a57; background: #dce3ea; }
    .heat-chip.bookmarks {
      color: #8a6a3a; background: #ead9b8;
      border-color: rgba(138, 106, 58, .28);
    }
    .heat-chip.views { color: #8a8276; background: #ebe4d6; }
    .heat-chip.empty { opacity: .55; font-weight: 400; }
    .heat-note { font-size: 11px; color: var(--faint); margin: 6px 0 0; }
    .insp .heat { margin: 0 0 14px; }
    .kw-filter { margin: 0 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .kw-filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .kw-search {
      position: relative;
      flex: 1 1 180px;
      min-width: 160px;
      max-width: 320px;
    }
    .kw-search::before {
      content: ""; position: absolute; left: 12px; top: 50%; width: 12px; height: 12px;
      margin-top: -7px; border: 1.5px solid var(--faint); border-radius: 50%;
      pointer-events: none;
    }
    .kw-search::after {
      content: ""; position: absolute; left: 22px; top: 50%; width: 6px; height: 1.5px;
      margin-top: 3px; background: var(--faint); transform: rotate(45deg);
      pointer-events: none;
    }
    .kw-search input[type="search"] {
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px 8px 32px;
      font: inherit;
      font-size: 13px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 250, 240, .55);
      transition: border-color .15s ease, box-shadow .15s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .kw-search input[type="search"]::placeholder { color: var(--faint); }
    .kw-search input[type="search"]::-webkit-search-decoration,
    .kw-search input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
    .kw-search input[type="search"]:hover { border-color: color-mix(in srgb, var(--line) 40%, var(--accent-dim)); }
    .kw-search input[type="search"]:focus {
      border-color: var(--accent-dim);
      box-shadow: inset 0 1px 0 rgba(255, 250, 240, .55), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .kw-quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
    .kw-quick .kw-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .kw-active {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
      border: 1px solid var(--line); background: var(--bg-2);
      border-radius: 10px; padding: 8px 10px; font-size: 12px;
    }
    .kw-active .kid {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--accent); font-weight: 600;
    }
    .kw-active .why { color: var(--text); flex: 1 1 180px; }
    .kw-active .meta { color: var(--muted); }
    .kw-active .clear {
      border: 0; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px;
    }
    .kw-active .clear:hover { color: var(--text); }
    .kw-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--bg-3); color: var(--accent);
      cursor: pointer;
    }
    .kw-chip .n { font-family: inherit; color: var(--muted); font-weight: 600; }
    .kw-chip.on .n { color: rgba(255,255,255,.85); }
    .kw-chip:hover { border-color: var(--accent); }
    .kw-catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .kw-catalog-card {
      border: 1px solid var(--line); background: var(--bg-2);
      border-radius: 12px; padding: 12px; text-align: left; color: inherit;
      cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    }
    .kw-catalog-card:hover { border-color: var(--accent); }
    .kw-catalog-card .kid {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; color: var(--accent); font-weight: 600;
    }
    .kw-catalog-card .meta { font-size: 11px; color: var(--muted); }
    .kw-catalog-card .query {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; color: var(--text); line-height: 1.4;
      word-break: break-word;
    }
    .kw-catalog-card .why { font-size: 12px; color: var(--muted); line-height: 1.35; }
    .kw-catalog-card .count { font-size: 11px; color: var(--faint); margin-top: auto; }
    .kw-active .query {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; color: var(--text); flex: 1 1 220px; word-break: break-word;
    }
    .kw-catalog-card .count b { color: var(--text); }
    .kw-catalog-card .go {
      font-size: 11px; color: var(--accent); border: 0; background: transparent;
      padding: 0; cursor: pointer; text-align: left; font: inherit;
    }
    .row .id {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; color: var(--accent); letter-spacing: .02em;
    }
    .row .label { font-size: 15px; margin-top: 4px; }
    .row .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .row .side {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
      gap: 10px; min-height: 52px;
    }
    .plat-mark {
      width: 28px; height: 28px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
      flex-shrink: 0;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: flex-start; max-width: 280px; }
    .pill-stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .pill-row { display: inline-flex; flex-wrap: nowrap; gap: 6px; align-items: center; }
    .score {
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 22px; color: var(--sumi); line-height: 1;
    }
    .pill {
      display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: var(--chip); color: var(--muted); white-space: nowrap;
    }
    .pill.gap { color: var(--gap); background: #f3ddd4; }
    .pill.ok { color: var(--ok); background: #dce6d8; }
    .pill.hit-n { color: #3d4a57; background: #dce3ea; }
    .pill.hit-win { color: var(--ok); background: #dce6d8; }
    .pill.hit-loss { color: var(--gap); background: #f3ddd4; }
    .ipgrid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 0; max-width: 42em; }
    .ipcard {
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 18px; cursor: pointer; text-align: left;
    }
    .ipcard:hover, .ipcard.on { border-color: var(--accent); box-shadow: var(--shadow); }
    .ipcard .hid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); }
    .ipcard .ttl {
      font-family: "Iowan Old Style", "Songti SC", Georgia, serif;
      font-size: 17px; line-height: 1.35; margin: 6px 0 0;
    }
    .mediagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
    .mediacard.sel { border-color: var(--accent); box-shadow: var(--shadow); }
    .mediacard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .mediacard .thumb {
      aspect-ratio: 4 / 3; background: #ece7df; display: flex;
      align-items: center; justify-content: center; overflow: hidden;
    }
    .mediacard .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mediacard .thumb.thumb-missing { color: var(--faint); font-size: 24px; }
    .mediameta { padding: 10px 12px; display: grid; gap: 6px; }
    .mediameta .ttl { font-size: 13px; line-height: 1.3; margin: 0; }
    .mediameta .hid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--accent); }
    .prof-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px;
    }
    .prof-stats > div {
      background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 12px;
    }
    .prof-stats b {
      display: block; font-family: "Iowan Old Style", Georgia, serif;
      font-size: 22px; font-weight: 500; line-height: 1.1; margin-bottom: 4px;
    }
    .prof-stats span { font-size: 11px; color: var(--faint); }
    .prof-pillars { display: grid; gap: 8px; margin: 0 0 18px; }
    .prof-pill {
      display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: baseline;
      padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
      font-size: 13px;
    }
    .prof-pill .hid { color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    .prof-accts button { margin-top: 0; margin-bottom: 8px; }
    .prof-docs { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
    .gap-list { display: grid; gap: 8px; margin: 0 0 4px; }
    .gap-list p {
      margin: 0; padding: 10px 12px; border-radius: 12px; font-size: 13px;
      background: #f3ddd4; color: var(--gap); border: 1px solid rgba(161, 74, 56, .18);
    }
    .stage-file-lite {
      display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center;
      width: 100%; text-align: left; cursor: pointer;
      font-family: inherit; font-size: 13px; color: var(--text);
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px;
    }
    .stage-file-lite:hover { border-color: var(--accent-dim); background: var(--bg-3); }
    .stage-file-lite .sk { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ok); }
    .stage-file-lite .sp {
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--faint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .stage-file-lite .sa { font-size: 12px; color: var(--accent); }
    .empty {
      color: var(--faint); padding: 48px 8px;
      text-align: center;
    }
    .empty strong { display: block; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .insp h2 {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--faint); font-weight: 600; margin: 22px 0 10px;
    }
    .insp h2:first-child { margin-top: 0; }
    .insp .kicker { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent); margin: 0 0 6px; }
    .insp .title {
      font-family: "Iowan Old Style", "Songti SC", Georgia, serif;
      font-size: 22px; line-height: 1.3; margin: 0 0 16px;
    }
    .insp .title-btn {
      font: inherit; color: inherit; text-align: left; text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
    }
    .insp .title-btn:hover { color: var(--accent); }
    .kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; font-size: 13px; margin: 0 0 16px; }
    .kv dt { color: var(--faint); }
    .kv dd { margin: 0; }
    .trace { margin: 4px 0 20px; }
    .tstep {
      display: grid; grid-template-columns: 18px 1fr; gap: 10px;
      position: relative; align-items: stretch;
    }
    .tspine {
      position: relative;
      width: 18px;
      justify-self: stretch;
    }
    .tstep .dot {
      position: relative; z-index: 1;
      display: block; box-sizing: border-box;
      width: 10px; height: 10px; margin: 5px auto 0;
      border-radius: 50%; background: var(--line);
    }
    .tstep .dot.on { background: var(--accent); }
    .tstep .dot.here { background: var(--ok); box-shadow: 0 0 0 4px rgba(156,186,134,.18); }
    .tstep .rail {
      position: absolute;
      left: 50%;
      top: 15px;
      bottom: -5px;
      width: 2px;
      margin-left: -1px;
      background: var(--line);
      border-radius: 1px;
      pointer-events: none;
    }
    .tstep:last-child .rail { display: none; }
    .tcard { padding: 0 0 16px; min-height: 28px; }

    .tcard button {

    .vacant { color: var(--faint); font-size: 12px; font-style: italic; padding: 2px 0 4px; }
    .note { font-size: 12px; color: var(--muted); }
    .warn {
      color: var(--gap); font-size: 12px; background: #f3ddd4; border-radius: 10px; padding: 10px 12px;
    }
    .subtabs { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 16px; }
    .subtabs button { border-radius: 999px; padding: 6px 14px; }

    /* Schedule & Cadence styles */

      margin-bottom: 18px;

    .sched-date-badge {

    /* Calendar View Styles */

    .cal-toolbar {

      box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;

    .cal-platform-dropdown {

    .cal-cell {

    }
    .cal-cell.is-today {

      box-shadow: 0 0 0 1px var(--accent-dim) inset;
    }
    .cal-cell.is-selected {
      outline: 2px solid var(--accent); background: #fffcf0;
      box-shadow: 0 2px 8px rgba(156, 61, 50, .14);
    }
    .cal-cell-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
    }

    .cal-cell-badge {

      font-size: 10px; color: var(--faint); font-weight: 600;

    .cal-post-pill {

    .cal-post-pill.status-published {
      background: #eaf3ec; border-color: #b7d8be; color: #20572b;
    }
    .cal-post-pill.status-reviewed {
      background: #e8f1f8; border-color: #bad5ec; color: #164673;
    }
    .cal-post-pill.status-scheduled {
      background: #fcf3e3; border-color: #f1d8ab; color: #8a4f00;
    }
    .cal-post-pill.status-overdue {
      background: #fdeeed; border-color: #f5c4c0; color: #9e2319;
    }

    }

    /* GitHub Heatmap Styles */

    .gh-cell {

    }

    /* Unified Calendar Cadence Strip & Upcoming Queue */
    .cal-cadence-strip {

      margin-bottom: 14px;

    .cal-cadence-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 10px; cursor: pointer; transition: all .15s ease;

    footer.hint { margin-top: 28px; color: var(--faint); font-size: 12px; }

    .md-actions button {

      align-items: center; justify-content: center;
    }
    .md-modal.on { display: flex; }
    .md-sheet {
      width: min(960px, 100%);
      height: min(820px, 88vh);
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255,252,245,.55), transparent 48px),
        var(--paper);
      border: 1px solid #cbb896;
      border-radius: 18px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.55) inset,
        0 28px 80px rgba(42, 32, 18, .28),
        0 2px 0 rgba(90, 60, 20, .06);
      display: flex; flex-direction: column; overflow: hidden;
      position: relative;
    }
    .md-sheet::before {

    let lang = localStorage.getItem("wb-lang") || "zh";
    let profileScope = localStorage.getItem("wb-profile") || "";
    function t(k, vars) {
      let s = (STR[lang] && STR[lang][k]) || STR.zh[k] || k;
      if (vars) Object.entries(vars).forEach(([a, b]) => { s = s.replaceAll("{" + a + "}", b); });
      return s;
    }
    function kindName(k) { return t("kind_" + k); }
    function profileList() { return GRAPH.profiles || []; }
    function activePillars() {
      const by = GRAPH.pillars_by_profile || {};
      if (profileScope && by[profileScope]) return by[profileScope];
      const merged = {};
      Object.values(by).forEach(p => Object.assign(merged, p));
      return Object.keys(merged).length ? merged : (GRAPH.pillars || {});
    }
    function pillarName(id) {
      const p = activePillars()[id] || (GRAPH.pillars || {})[id];
      if (!p) return id;
      return lang === "zh" ? p.zh : p.en;
    }
    function formatPillar(cell) {
      if (!cell) return "";
      const ids = [...new Set(String(cell).match(/P\d+/g) || [])];
      if (!ids.length) return cell;
      const sep = lang === "zh" ? "：" : ": ";
      return ids.map(id => `${id}${sep}${pillarName(id)}`).join(" · ");
    }
    function pillarIds() {
      return Object.keys(activePillars());
    }
    function nodeProfiles(n) {
      if (!n) return [];
      if (n.kind === "profile") return [n.ident];
      if (n.kind === "account") return n.profile_id ? [n.profile_id] : [];
      if (n.profile) return [n.profile];
      if (n.profiles) {
        return String(n.profiles).split(",").map(s => s.trim()).filter(s => s && s !== "*");
      }
      if (n.kind === "published" && n.run_id) {
        const run = GRAPH.nodes.find(x => x.kind === "run" && x.ident === n.run_id);
        return run && run.profile ? [run.profile] : [];
      }
      if (n.kind === "raw" && n.capture_id) {
        const c = GRAPH.nodes.find(x => x.kind === "capture" && x.ident === n.capture_id);
        return c && c.profile ? [c.profile] : [];
      }
      return [];
    }
    function inScope(n) {
      if (!profileScope) return true;
      if (n.kind === "profile") return n.ident === profileScope;
      if (n.kind === "account") return n.profile_id === profileScope;
      if (n.lib && n.profiles) {
        const parts = String(n.profiles).split(",").map(s => s.trim());
        if (parts.includes("*") || parts.includes(profileScope)) return true;
        return false;
      }
      const ps = nodeProfiles(n);
      if (!ps.length) return true;
      return ps.includes(profileScope);
    }
    function scoped(kind) { return GRAPH.nodes.filter(n => n.kind === kind && inScope(n)); }

    function rebuildIndexes() {
      byId = Object.fromEntries((GRAPH.nodes || []).map(n => [n.id, n]));
      adj = new Map();
      for (const e of GRAPH.edges || []) {
        if (!adj.has(e.from)) adj.set(e.from, []);
        if (!adj.has(e.to)) adj.set(e.to, []);
        adj.get(e.from).push(e.to);
        adj.get(e.to).push(e.from);
      }
    }
    rebuildIndexes();

    function graphApiUrl(name) {
      return new URL(name, location.href).toString();
    }

    async function loadLiveGraph() {
      if (!isHttpServe()) return false;
      const res = await fetch(graphApiUrl("api/graph"), { cache: "no-store" });
      if (!res.ok) throw new Error(`graph ${res.status}`);
      const next = await res.json();
      if (!next || !Array.isArray(next.nodes)) throw new Error("invalid graph");
      GRAPH = next;
      rebuildIndexes();
      document.getElementById("stamp").textContent = GRAPH.generated_at || "";
      return true;
    }

    function watchVault() {
      if (!isHttpServe() || typeof EventSource === "undefined") return;
      let timer = 0;
      const es = new EventSource(graphApiUrl("api/events"));
      es.onmessage = () => {
        clearTimeout(timer);
        // Debounce bursts of Agent writes into one refetch.
        timer = setTimeout(async () => {
          try {
            await loadLiveGraph();
            applyChrome();
            render();
          } catch (err) {
            console.warn("workbench live reload failed", err);
          }
        }, 250);
      };
      es.onerror = () => {
        // Browser will retry EventSource; no hard fail.
      };
    }

    function vaultFetchUrl(rel) {
      return "../" + String(rel || "").replace(/^\/+/, "");
    }

    function isHttpServe() {
      return location.protocol === "http:" || location.protocol === "https:";
    }

    function refreshServeBanner() {
      const el = document.getElementById("serveBanner");
      if (!isHttpServe()) {
        el.classList.add("on");
        el.innerHTML = `${t("serve_banner")} <code>${esc(t("serve_cmd"))}</code>`;
      } else {
        el.classList.remove("on");
        el.textContent = "";
      }
    }

    function closeMd() {
      $modal.classList.remove("on");
      $sheet.classList.remove("run-mode");
      $mdBody.innerHTML = "";
      $mdRail.innerHTML = "";
      $mdPath.textContent = "";
      $mdSub.textContent = "";
      runModal = null;
      mdFetchToken += 1;
    }

    async function loadMdIntoBody(rel) {
      const token = ++mdFetchToken;
      $mdPath.textContent = rel || "";
      $mdBody.innerHTML = `<p class="note">${esc(t("md_loading"))}</p>`;
      if (!rel) {
        $mdBody.innerHTML = `<p class="md-err">${esc(t("md_missing"))}</p>`;
        return;
      }
      if (!isHttpServe()) {
        $mdBody.innerHTML = `<p class="md-err">${esc(t("md_need_serve"))}</p><p><code>${esc(t("serve_cmd"))}</code></p>`;
        return;
      }
      try {
        const res = await fetch(vaultFetchUrl(rel));
        if (!res.ok) throw new Error(String(res.status));
        const text = await res.text();
        if (token !== mdFetchToken) return;
        $mdBody.innerHTML = renderMarkdown(text);
      } catch {
        if (token !== mdFetchToken) return;
        $mdBody.innerHTML = `<p class="md-err">${esc(t("md_missing"))}</p><p class="note">${esc(rel)}</p>`;
      }
    }

    function paintRunRail(n, active) {
      const files = n.stage_files || {};
      const steps = STAGE_ORDER.map((k, i) => {
        const p = files[k];
        const cls = ["rail-step", p ? "has" : "miss", k === active ? "on" : ""].filter(Boolean).join(" ");
        const idx = String(i + 1).padStart(2, "0");
        const fileHint = p ? p.split("/").pop() : t("no_stage");
        return `<li><button type="button" class="${cls}" data-stage="${esc(k)}" ${p ? "" : "disabled"}>
          <span class="rail-spine" aria-hidden="true"><span class="dot"></span><span class="wire"></span></span>
          <span class="rail-card">
            <span class="sn"><span class="idx">${idx}</span>${esc(k)}</span>
            <span class="sf">${esc(fileHint)}</span>
          </span>
        </button></li>`;
      }).join("");
      $mdRail.innerHTML = `<div class="rail-lab">${t("stages_h")}</div><ol class="rail-flow">${steps}</ol>`;
      $mdRail.querySelectorAll("button[data-stage]:not([disabled])").forEach(btn => {
        btn.onclick = () => openRun(n, btn.getAttribute("data-stage"));
      });
    }

    function defaultStage(n) {
      const files = n.stage_files || {};
      return STAGE_ORDER.find(k => files[k]) || STAGE_ORDER[0];
    }

    function openRun(n, stage) {
      if (!n || n.kind !== "run") return;

    function inlineMd(text) {
      return esc(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    }

    function renderMarkdown(src) {
      const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;
      let para = [];
      let listType = null;
      const flushPara = () => {
        if (!para.length) return;
        out.push("<p>" + inlineMd(para.join(" ")) + "</p>");
        para = [];
      };
      const flushList = () => {
        if (!listType) return;
        out.push(listType === "ul" ? "</ul>" : "</ol>");
        listType = null;
      };
      while (i < lines.length) {
        const line = lines[i];
        if (line.startsWith("```")) {
          flushPara(); flushList();
          const buf = [];
          i += 1;
          while (i < lines.length && !lines[i].startsWith("```")) {
            buf.push(lines[i]);
            i += 1;
          }
          out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
          i += 1;
          continue;
        }
        if (/^\|.+\|$/.test(line) && i + 1 < lines.length && /^\|[\s:\-|]+\|$/.test(lines[i + 1])) {
          flushPara(); flushList();
          const rows = [];
          while (i < lines.length && /^\|.+\|$/.test(lines[i])) {
            if (!/^\|[\s:\-|]+\|$/.test(lines[i])) rows.push(lines[i]);
            i += 1;
          }
          const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
          const head = cells(rows[0] || "");
          const body = rows.slice(1);
          out.push("<table><thead><tr>" + head.map(c => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead>");
          out.push("<tbody>" + body.map(r => "<tr>" + cells(r).map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
          continue;
        }
        if (!line.trim()) {
          flushPara(); flushList();
          i += 1;
          continue;
        }
        const hm = /^(#{1,3})\s+(.+)$/.exec(line);
        if (hm) {
          flushPara(); flushList();
          const lvl = hm[1].length;
          out.push(`<h${lvl}>` + inlineMd(hm[2]) + `</h${lvl}>`);
          i += 1;
          continue;
        }
        if (/^>\s?/.test(line)) {
          flushPara(); flushList();
          out.push("<blockquote><p>" + inlineMd(line.replace(/^>\s?/, "")) + "</p></blockquote>");
          i += 1;
          continue;
        }
        const ul = /^[-*]\s+(.+)$/.exec(line);
        const ol = /^\d+\.\s+(.+)$/.exec(line);
        if (ul || ol) {
          flushPara();
          const kind = ul ? "ul" : "ol";
          if (listType !== kind) {
            flushList();
            listType = kind;
            out.push(kind === "ul" ? "<ul>" : "<ol>");
          }
          out.push("<li>" + inlineMd((ul || ol)[1]) + "</li>");
          i += 1;
          continue;
        }
        flushList();
        para.push(line);
        i += 1;
      }
      flushPara();
      flushList();
      return out.join("\n") || "<p></p>";
    }

    function mdFileForNode(n) {
      if (!n) return "";
      if (n.kind === "run") return "";
      if (n.open_file) return n.open_file;
      if (n.path && String(n.path).endsWith(".md")) return n.path;
      return "";
    }

    function runMetaHtml(n) {
      const files = n.stage_files || {};
      const have = STAGE_ORDER.filter(k => files[k]).join(" · ") || t("no_stage");
      const sel = n.selection || {};
      const todayStr = getTodayStr();
      const st = getPostStatusInfo(n, todayStr);
      const chain = n.pack_chain || {};
      const contracts = chain.contracts || [];
      const media = chain.media || [];
      const templates = chain.templates || [];
      const exp = chain.experiment || {};
      const meta = chain.meta || {};

      let schedHtml = "";
      if (st.code === "reviewed") {
        schedHtml = `<p class="note" style="color:#164673; font-weight:600;">🔵 已复盘 (结果: ${esc(n.published_result || "unknown")}) · 发布于 ${esc(n.published_date || n.date)} ${n.published_url ? `· <a href="${esc(n.published_url)}" target="_blank" rel="noreferrer">查看帖子 ↗</a>` : ""}</p>`;
      } else if (st.code === "published") {
        schedHtml = `<p class="note" style="color:#20572b; font-weight:600;">🟢 已发布于 ${esc(n.published_date || n.date)} ${n.published_url ? `· <a href="${esc(n.published_url)}" target="_blank" rel="noreferrer">查看帖子 ↗</a>` : ""}</p>`;
      } else if (st.code === "overdue") {
        schedHtml = `<p class="note" style="color:#9e2319; font-weight:600;">🔴 过期未发 · 原定时间 ${esc(n.scheduled_date || n.date)}（待手动发布）</p>`;
      } else if (st.code === "scheduled") {
        schedHtml = `<p class="note" style="color:#8a4f00; font-weight:600;">🟠 计划发布时间：${esc(n.scheduled_date || n.date)}（待手动发布）</p>`;
      } else {
        schedHtml = `<p class="note">⚪ 当前状态：${esc(n.status)}（尚未设定具体排期）</p>`;
      }

      let chainHtml = "";
      if (contracts.length || templates.length || media.length || chain.arc) {
        const contractLines = contracts.map(c =>
          `P${c.page}: ${esc(c.page_role || "—")} · ${esc(c.density || "")} · ${esc(c.slot_summary || "")}`
        ).join("<br>");
        const mediaLines = media.map(m =>
          `P${esc(m.page)}: ${esc(m.media_id)} (${esc(m.subject || "")}/${esc(m.role || "")})`
        ).join("<br>");
        const tplLines = templates.map(trow =>
          `P${trow.page}: ${esc(trow.layout_family || "—")} / ${esc(trow.template_id || "—")} · ${esc(trow.mode || "")} · ${esc(trow.evidence || "")}`
        ).join("<br>");
        chainHtml = `<div class="note" style="margin-top:10px;line-height:1.45;">
          <strong>选择链</strong>
          ${meta.w_ids ? `<br>W-: ${esc(meta.w_ids)}` : ""}
          ${n.topic_id ? `<br>Topic: ${esc(n.topic_id)}` : ""}
          ${chain.arc ? `<br>Arc: ${esc(chain.arc)}` : ""}
          ${contractLines ? `<br><br>Page Contracts<br>${contractLines}` : ""}
          ${mediaLines ? `<br><br>Media<br>${mediaLines}` : ""}
          ${tplLines ? `<br><br>Layout / Template<br>${tplLines}` : ""}
          ${(n.published_result || n.published_evidence_tier) ? `<br><br>Published · result=${esc(n.published_result || "—")} · evidence=${esc(n.published_evidence_tier || "unknown")}${n.published_layout_family ? ` · family=${esc(n.published_layout_family)}` : ""}` : ""}
          ${exp.comparable ? `<br>Experiment comparable=${esc(exp.comparable)}${exp.variables_changed ? ` · changed=${esc(exp.variables_changed)}` : ""}` : ""}
        </div>`;
      }

      return `${schedHtml}
        <p class="note">${t("stages_h")}：${esc(have)}</p>
        <p class="note">${t("topic_bind", { t: n.topic_id || t("none"), s: sel.swipe, c: sel.claim })}</p>
        ${chainHtml}
        ${n.supersedes ? `<p class="note">${t("supersedes", { id: n.supersedes })}</p>` : ""}
        ${n.superseded_by ? `<p class="note">${t("superseded_by", { id: n.superseded_by })}</p>` : ""}`;
    }

    function nodesOf(kind) { return GRAPH.nodes.filter(n => n.kind === kind && inScope(n)); }

    function runIsShipped(r) {
      if ((r.ship_urls || []).length) return true;
      return nodesOf("published").some(p =>
        (p.run_id && p.run_id === r.ident) ||
        (r.folder && p.run_folder && p.run_folder === r.folder)
      );
    }
    function runClosedWithoutShip(r) {
      return r.status === "superseded" || r.status === "killed";
    }
    function unshippedRuns() {
      return nodesOf("run").filter(r => !runIsShipped(r) && !runClosedWithoutShip(r));
    }
    function citesPart(p, n) {
      const id = n.ident;
      const cell = n.kind === "swipe" ? p.swipe : n.kind === "atom" ? p.atoms : n.kind === "claim" ? p.claim : "";
      const v = String(cell || "").trim();
      if (!v || v.toLowerCase() === "none") return false;
      return v.split(/[,;]/).some(tok => (tok.split(":").pop() || "").trim() === id);
    }
    function publishedFor(n, ctx) {
      if (n.kind === "published") return [n];
      if (n.kind === "swipe" || n.kind === "atom" || n.kind === "claim") {
        return nodesOf("published").filter(p => citesPart(p, n));
      }
      const runs = n.kind === "run" ? [n] : ctx.filter(x => x.kind === "run");
      return nodesOf("published").filter(p => runs.some(r =>
        (p.run_id && p.run_id === r.ident) || (r.folder && p.run_folder === r.folder)
      ));
    }
    function qmatch(n) {
      const q = $q.value.trim().toLowerCase();
      if (!q) return true;
      const blob = [n.ident, n.label, n.kind, n.status, n.pillar, n.lane, n.generation_mode, n.profile, n.profiles, n.src_handle, n.url, n.notes, n.type, n.atom_type, n.topic_id, n.audience, n.need_ids, n.product_ids, n.product_fit, n.recommendation_ids, n.source_type, n.capture_id, n.source, n.keyword_id, n.hit_kind, n.signal, n.excerpt].filter(Boolean).join(" ").toLowerCase();
      return blob.includes(q);
    }
    function connected(id) {
      const seen = new Set([id]);
      const q = [id];
      while (q.length) {
        const cur = q.shift();
        for (const n of adj.get(cur) || []) {
          if (!seen.has(n)) { seen.add(n); q.push(n); }
        }
      }
      return [...seen].map(i => byId[i]).filter(Boolean);
    }

      const n = byId[id];

    function numCompact(v) {
      if (v === null || v === undefined || v === "") return null;
      const n = Number(String(v).replace(/,/g, ""));
      if (!Number.isFinite(n)) return null;
      if (n >= 10000) return `${(n / 1000).toFixed(n % 1000 === 0 ? 0 : 1)}k`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)}k`.replace(/\.0k$/, "k");

    }

      // No strip when every metric is missing — empty "—" chips inflate row height.
      if (!hasHeat(n)) return "";
      const hint = opts.hint ? `<span class="heat-note">${esc(t("heat_hint"))}</span>` : "";
      const items = [
        { key: "likes", sym: "♥", title: "likes" },
        { key: "replies", sym: "💬", title: "replies" },
        { key: "bookmarks", sym: "🔖", title: "bookmarks" },
        { key: "views", sym: "👁", title: "views" },

      const chips = items.map(({ key, sym, title }) => {
        const val = heatMetric(n, key);
        const shown = val === null ? "—" : val;
        const empty = val === null ? " empty" : "";
        return `<span class="heat-chip ${key}${empty}" title="${esc(title)}"><span class="sym">${sym}</span><span class="val">${esc(shown)}</span></span>`;

    function pills(n) {
      const bits = [];
      if (n.kind === "need") {
        const st = n.status || "";
        const cls = st === "promoted" ? "ok" : (st === "captured" ? "gap" : "");
        if (st) bits.push(`<span class="pill ${cls}">${esc(st)}</span>`);
        if (n.source_type) bits.push(`<span class="pill">${esc(n.source_type)}</span>`);
        if (n.frequency) bits.push(`<span class="pill">×${esc(n.frequency)}</span>`);
      }
      if (n.kind === "hit") {
        const st = n.status || "";
        const cls = st === "triage" ? "gap" : (st === "discarded" ? "" : "ok");
        if (st) bits.push(`<span class="pill ${cls}">${esc(st)}</span>`);
        if (n.keyword_id) bits.push(`<button type="button" class="kw-chip" data-kw-filter="${esc(n.keyword_id)}">${esc(n.keyword_id)}</button>`);
        if (n.signal) bits.push(`<span class="pill">${esc(n.signal)}</span>`);
        if (n.hit_kind) bits.push(`<span class="pill">${esc(n.hit_kind)}</span>`);
      }
      if (n.kind === "topic") {
        bits.push(`<span class="pill">${esc(n.status)}</span>`);
        if (n.source_type) bits.push(`<span class="pill">${esc(n.source_type)}</span>`);
        if (n.generation_mode) bits.push(`<span class="pill">${esc(n.generation_mode)}</span>`);
        bits.push(n.usage === "unused" ? `<span class="pill gap">${t("unused")}</span>` : `<span class="pill ok">${esc(n.usage)}</span>`);
      }
      if (n.kind === "run") {
        const cls = n.status === "published" ? "ok" : n.status === "superseded" || n.status === "killed" ? "gap" : "";
        bits.push(`<span class="pill ${cls}">${esc(n.status)}</span>`);
        if (!runIsShipped(n)) {
          if (n.status === "superseded") bits.push(`<span class="pill">${t("gap_superseded")}</span>`);
          else if (n.status === "killed") bits.push(`<span class="pill">${t("gap_killed")}</span>`);
          else bits.push(`<span class="pill gap">${t("gap_unshipped")}</span>`);
        }
      }
      if (n.kind === "capture" && n.library_cell === "none") bits.push(`<span class="pill gap">${t("no_lib")}</span>`);
      if (n.kind === "published") {
        if (n.result) bits.push(`<span class="pill">${esc(n.result)}</span>`);
        if (!n.reviewable) bits.push(`<span class="pill gap">${t("thin")}</span>`);

        if (st) row1.push(`<span class="pill ${cls}">${esc(st)}</span>`);
        row1.push(`<span class="pill hit-win">${esc(t("lib_win", { v: n.win ?? 0 }))}</span>`);
        row1.push(`<span class="pill hit-loss">${esc(t("lib_loss", { v: n.loss ?? 0 }))}</span>`);

        ].filter(Boolean).join(" · ");
        cards.appendChild(listRowEl(n, meta));
      });
      if (!needs.length) {
        cards.innerHTML = `<p class='empty'>${t("no_need")}</p><p class="note">${esc(t("need_empty_hint"))}</p>`;

    function keywordsInScope(opts = {}) {
      const all = GRAPH.keywords || [];
      let rows = profileScope
        ? all.filter(k => k.profile === profileScope)
        : all.slice();
      if (opts.activeOnly !== false) rows = rows.filter(k => k.status === "active" || !k.status);
      if (opts.track) rows = rows.filter(k => (k.track || "listen") === opts.track);
      return rows;
    }
    function listenKeywordsInScope() {
      return keywordsInScope({ track: "listen" });
    }
    function hitCountForKeyword(kid) {
      return nodesOf("hit").filter(h => h.keyword_id === kid).length;
    }
    function triageCountForKeyword(kid) {
      return nodesOf("hit").filter(h => h.keyword_id === kid && h.status === "triage").length;
    }
    function keywordMatchesQuery(k, q) {
      if (!q) return true;
      const blob = [k.id, k.why, k.query, k.intent, k.layer, k.pillar].filter(Boolean).join(" ").toLowerCase();
      return blob.includes(q);
    }
    function rankedKeywords(opts = {}) {
      const base = opts.forHits ? listenKeywordsInScope() : keywordsInScope({ activeOnly: false, track: opts.track || "" });
      return base
        .map(k => ({
          ...k,
          track: k.track || "listen",
          triage: triageCountForKeyword(k.id),
          total: hitCountForKeyword(k.id),
        }))
        .sort((a, b) => (b.triage - a.triage) || (b.total - a.total) || (Number(b.weight || 0) - Number(a.weight || 0)));
    }
    function keywordById(kid) {
      return (GRAPH.keywords || []).find(k => k.id === kid && (!profileScope || k.profile === profileScope))
        || (GRAPH.keywords || []).find(k => k.id === kid)
        || null;
    }
    function keywordIdNum(id) {
      const m = String(id || "").match(/K-(\d+)/i);
      return m ? Number(m[1]) : 0;
    }
    function keywordOptionLabel(k) {
      const triage = typeof k.triage === "number" ? k.triage : triageCountForKeyword(k.id);
      const total = typeof k.total === "number" ? k.total : hitCountForKeyword(k.id);
      const bits = [k.id];
      if (k.track && k.track !== "listen") bits.push(k.track);
      if (k.layer) bits.push(k.layer);
      bits.push(`${triage}/${total}`);
      return bits.join(" · ");
    }
    function bindKwFilters(root) {
      root.querySelectorAll("[data-kw-filter]").forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();

          const kid = btn.getAttribute("data-kw-filter") || "";
          hitKw = hitKw === kid ? "" : kid;
          hitsSub = "list";
          renderHits();
        };
      });
    }

      const listenN = listenKeywordsInScope().length;

          <span class="query" title="${esc((k && k.why) || "")}">${esc((k && k.query) || "")}</span>
          <span class="meta"><b>${triage}</b> ${esc(t("kw_triage"))} · ${total} ${esc(t("kw_hits"))}</span>

    function renderHitsList() {
      const statuses = [...new Set(nodesOf("hit").map(x => x.status).filter(Boolean))];

         <select id="h-kw"><option value="">${t("f_keyword")} (${listenKeywordsInScope().length})</option>${kwOptions.map(k => `<option value="${esc(k.id)}" ${k.id === hitKw ? "selected" : ""}>${esc(keywordOptionLabel(k))}</option>`).join("")}</select>`,

          paintCards();
        }
      );

    function wikiKindColor(kind) {
      const map = {
        profile: "#8b6b4a",
        wiki: "#9c3d32",
        need: "#5a9e8f",
        capture: "#7d9aa8",
        product: "#7a6b9e",
        topic: "#9c3d32",
        run: "#8aa87a",
        published: "#6b8f9e",
        swipe: "#c4a06a",
        atom: "#a78bb0",
        claim: "#d08a78",
      };
      return map[kind] || "#8a8276";
    }

    function wikiGraphKinds() {
      if (wikiGraphMode === "judgments") return new Set(["profile", "wiki"]);
      if (wikiGraphMode === "full") {
        return new Set(["profile", "wiki", "need", "capture", "product", "topic", "run", "published", "swipe", "atom", "claim"]);
      }
      return new Set(["profile", "wiki", "need", "product", "topic", "run", "published"]);
    }

    function buildWikiSubgraph() {
      const kinds = wikiGraphKinds();
      const wikiNodes = (GRAPH.nodes || []).filter(n => n.kind === "wiki" && inScope(n));
      const seed = new Set(wikiNodes.map(n => n.id));
      if (profileScope && byId[`profile:${profileScope}`]) seed.add(`profile:${profileScope}`);
      const keep = new Set(seed);
      for (const e of GRAPH.edges || []) {
        if (!seed.has(e.from) && !seed.has(e.to)) continue;
        const a = byId[e.from], b = byId[e.to];
        if (!a || !b) continue;
        if (!kinds.has(a.kind) || !kinds.has(b.kind)) continue;
        keep.add(e.from); keep.add(e.to);
      }
      // pull published results for included runs
      if (kinds.has("published")) {
        const runIds = new Set([...keep].filter(id => id.startsWith("run:")));
        for (const e of GRAPH.edges || []) {
          if (e.rel !== "from_run") continue;
          if (!runIds.has(e.to)) continue;
          const pub = byId[e.from];
          if (pub && pub.kind === "published") keep.add(e.from);
        }
      }
      const nodes = [...keep].map(id => byId[id]).filter(Boolean);
      const nodeSet = new Set(nodes.map(n => n.id));
      const links = (GRAPH.edges || []).filter(e => nodeSet.has(e.from) && nodeSet.has(e.to));
      return { nodes, links };
    }

    function stopWikiGraphAnim() {
      if (wikiGraphAnim) {
        cancelAnimationFrame(wikiGraphAnim);
        wikiGraphAnim = null;
      }
    }

    function shortWikiLabel(n) {
      if (n.kind === "wiki") return n.ident.replace(/^W-/, "");
      if (n.kind === "need") return n.ident.replace(/^N-\d{8}-/, "N-");
      if (n.kind === "topic") return n.ident.replace(/^T-\d{8}-/, "T-");
      if (n.kind === "run") return n.ident.replace(/^RUN-/, "R-").slice(0, 18);
      if (n.kind === "published") return (n.date || n.ident || "pub").slice(0, 12);
      if (n.kind === "profile") return "profile";
      return String(n.ident || n.label || "").slice(0, 16);
    }

    function mountWikiForceGraph(host, graph) {
      stopWikiGraphAnim();
      const width = Math.max(host.clientWidth || 640, 480);
      const height = Math.min(window.innerHeight * 0.62, 620);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "wiki-graph-svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", String(height));
      const root = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.appendChild(root);
      host.appendChild(svg);

      const nodes = graph.nodes.map((n, i) => {
        const angle = (i / Math.max(graph.nodes.length, 1)) * Math.PI * 2;
        const ring = n.kind === "profile" ? 0 : n.kind === "wiki" ? 120 : 220;
        return {
          ...n,
          x: width / 2 + Math.cos(angle) * ring,
          y: height / 2 + Math.sin(angle) * ring,
          vx: 0,
          vy: 0,
        };
      });
      const by = Object.fromEntries(nodes.map(n => [n.id, n]));
      const links = graph.links
        .map(e => ({ ...e, source: by[e.from], target: by[e.to] }))
        .filter(e => e.source && e.target);

      const gLinks = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const gLabels = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const gNodes = document.createElementNS("http://www.w3.org/2000/svg", "g");
      root.appendChild(gLinks);
      root.appendChild(gLabels);
      root.appendChild(gNodes);

      const linkEls = links.map(e => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "link");
        line.setAttribute("stroke-width", e.rel === "owns" || e.rel === "generates" || e.rel === "tests" ? "1.6" : "1");
        gLinks.appendChild(line);
        const lab = document.createElementNS("http://www.w3.org/2000/svg", "text");
        lab.setAttribute("class", "link-label");
        lab.textContent = e.rel || "";
        gLabels.appendChild(lab);
        return { e, line, lab };
      });

      const nodeEls = nodes.map(n => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node" + (selected === n.id ? " sel" : ""));
        g.dataset.id = n.id;
        const r = n.kind === "profile" ? 16 : n.kind === "wiki" ? 13 : 8;
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("r", String(r));
        c.setAttribute("fill", wikiKindColor(n.kind));
        c.setAttribute("stroke", "#faf6ec");
        c.setAttribute("stroke-width", "1.5");
        const lab = document.createElementNS("http://www.w3.org/2000/svg", "text");
        lab.setAttribute("class", "node-label");
        lab.setAttribute("text-anchor", "middle");
        lab.setAttribute("dy", String(r + 12));
        lab.textContent = shortWikiLabel(n);
        const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
        sub.setAttribute("class", "node-sub");
        sub.setAttribute("text-anchor", "middle");
        sub.setAttribute("dy", String(r + 23));
        sub.textContent = n.kind === "wiki" ? (n.state || n.status || "") : n.kind;
        g.appendChild(c);
        g.appendChild(lab);
        if (n.kind === "wiki" || n.kind === "profile") g.appendChild(sub);
        g.addEventListener("click", (ev) => {
          ev.stopPropagation();
          select(n.id);
        });
        g.addEventListener("dblclick", (ev) => {
          ev.stopPropagation();
          if (n.path) openMd(n.path, n.ident);
        });
        // node drag
        let dragging = false;
        g.addEventListener("pointerdown", (ev) => {
          if (ev.button !== 0) return;
          dragging = true;
          n.fx = n.x; n.fy = n.y;
          g.setPointerCapture(ev.pointerId);
          ev.stopPropagation();
        });
        g.addEventListener("pointermove", (ev) => {
          if (!dragging) return;
          const pt = clientToGraph(ev.clientX, ev.clientY);
          n.fx = pt.x; n.fy = pt.y;
          n.x = pt.x; n.y = pt.y;
        });
        g.addEventListener("pointerup", (ev) => {
          if (!dragging) return;
          dragging = false;
          n.fx = null; n.fy = null;
          try { g.releasePointerCapture(ev.pointerId); } catch (_) {}
        });
        gNodes.appendChild(g);
        return { n, g, r };
      });

      function applyTransform() {
        root.setAttribute("transform", `translate(${wikiGraphTransform.x},${wikiGraphTransform.y}) scale(${wikiGraphTransform.k})`);
      }
      applyTransform();

      function clientToGraph(cx, cy) {
        const rect = svg.getBoundingClientRect();
        const x = (cx - rect.left - wikiGraphTransform.x) / wikiGraphTransform.k;
        const y = (cy - rect.top - wikiGraphTransform.y) / wikiGraphTransform.k;
        return { x, y };
      }

      // pan + zoom
      let panning = false, pan0 = null;
      svg.addEventListener("pointerdown", (ev) => {
        if (ev.button !== 0) return;
        if (ev.target.closest(".node")) return;
        panning = true;
        svg.classList.add("dragging");
        pan0 = { x: ev.clientX, y: ev.clientY, tx: wikiGraphTransform.x, ty: wikiGraphTransform.y };
        svg.setPointerCapture(ev.pointerId);
      });
      svg.addEventListener("pointermove", (ev) => {
        if (!panning || !pan0) return;
        wikiGraphTransform.x = pan0.tx + (ev.clientX - pan0.x);
        wikiGraphTransform.y = pan0.ty + (ev.clientY - pan0.y);
        applyTransform();
      });
      svg.addEventListener("pointerup", (ev) => {
        panning = false;
        pan0 = null;
        svg.classList.remove("dragging");
        try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
      });
      svg.addEventListener("wheel", (ev) => {
        ev.preventDefault();
        const rect = svg.getBoundingClientRect();
        const mx = ev.clientX - rect.left;
        const my = ev.clientY - rect.top;
        const prev = wikiGraphTransform.k;
        const next = Math.min(2.8, Math.max(0.35, prev * (ev.deltaY < 0 ? 1.08 : 0.92)));
        wikiGraphTransform.x = mx - (mx - wikiGraphTransform.x) * (next / prev);
        wikiGraphTransform.y = my - (my - wikiGraphTransform.y) * (next / prev);
        wikiGraphTransform.k = next;
        applyTransform();
      }, { passive: false });

      const q = $q.value.trim().toLowerCase();
      function tick() {
        // repulsion
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            let dx = a.x - b.x, dy = a.y - b.y;
            let dist2 = dx * dx + dy * dy || 0.01;
            const dist = Math.sqrt(dist2);
            const force = 900 / dist2;
            dx = dx / dist * force; dy = dy / dist * force;
            a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
          }
        }
        // springs
        for (const e of links) {
          const a = e.source, b = e.target;
          let dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const ideal = (a.kind === "wiki" || b.kind === "wiki") ? 110 : 90;
          const k = 0.04;
          const f = (dist - ideal) * k;
          dx = dx / dist * f; dy = dy / dist * f;
          a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
        }
        // center gravity
        for (const n of nodes) {
          n.vx += (width / 2 - n.x) * 0.005;
          n.vy += (height / 2 - n.y) * 0.005;
          if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue; }
          n.vx *= 0.82; n.vy *= 0.82;
          n.x += n.vx; n.y += n.vy;
          n.x = Math.max(24, Math.min(width - 24, n.x));
          n.y = Math.max(24, Math.min(height - 24, n.y));
        }
        for (const { e, line, lab } of linkEls) {
          line.setAttribute("x1", e.source.x);
          line.setAttribute("y1", e.source.y);
          line.setAttribute("x2", e.target.x);
          line.setAttribute("y2", e.target.y);
          lab.setAttribute("x", (e.source.x + e.target.x) / 2);
          lab.setAttribute("y", (e.source.y + e.target.y) / 2);
          const hit = !q || `${e.source.ident} ${e.target.ident} ${e.rel}`.toLowerCase().includes(q)
            || shortWikiLabel(e.source).toLowerCase().includes(q)
            || shortWikiLabel(e.target).toLowerCase().includes(q);
          line.classList.toggle("dim", Boolean(q) && !hit);
          lab.classList.toggle("dim", Boolean(q) && !hit);
          lab.style.display = wikiGraphTransform.k < 0.7 ? "none" : "";
        }
        for (const { n, g } of nodeEls) {
          g.setAttribute("transform", `translate(${n.x},${n.y})`);
          g.classList.toggle("sel", selected === n.id);
          const blob = [n.ident, n.label, n.kind, n.state, n.status].join(" ").toLowerCase();
          g.classList.toggle("dim", Boolean(q) && !blob.includes(q));
        }
        wikiGraphAnim = requestAnimationFrame(tick);
      }
      wikiGraphAnim = requestAnimationFrame(tick);
    }

    function parseDateParts(s) {
      if (!s || typeof s !== "string") return null;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return null;
      return { y: parseInt(m[1], 10), m: parseInt(m[2], 10), d: parseInt(m[3], 10) };
    }

    function getWeekKey(s) {
      const p = parseDateParts(s);
      if (!p) return { key: "unknown", label: "未知周", year: 0, weekNo: 0 };
      const date = new Date(Date.UTC(p.y, p.m - 1, p.d));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);

      const target = new Date(Date.UTC(p.y, p.m - 1, p.d));
      const day = target.getUTCDay() || 7;
      const mon = new Date(target);
      mon.setUTCDate(target.getUTCDate() - day + 1);
      const sun = new Date(target);
      sun.setUTCDate(target.getUTCDate() - day + 7);
      const monStr = `${String(mon.getUTCMonth() + 1).padStart(2, '0')}-${String(mon.getUTCDate()).padStart(2, '0')}`;
      const sunStr = `${String(sun.getUTCMonth() + 1).padStart(2, '0')}-${String(sun.getUTCDate()).padStart(2, '0')}`;

      const yr = date.getUTCFullYear();
      return {
        key: `${yr}-W${String(weekNo).padStart(2, '0')}`,
        label: `${yr}年 第${weekNo}周 (${monStr} ~ ${sunStr})`,
        year: yr,
        weekNo: weekNo
      };
    }

    function getMonthKey(s) {
      const p = parseDateParts(s);
      if (!p) return "未知月";
      return `${p.y}-${String(p.m).padStart(2, '0')}`;
    }

    function formatFriendlyDate(s, currentLang) {
      const p = parseDateParts(s);
      if (!p) return s || "";
      const d = new Date(p.y, p.m - 1, p.d);
      const wDays = currentLang === "zh" ? ["周日", "周一", "周二", "周三", "周四", "周五", "周六"] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const wDay = wDays[d.getDay()];
      if (currentLang === "zh") {
        return `${p.m}月${p.d}日 ${wDay}`;
      }
      return `${p.m}/${p.d} ${wDay}`;
    }

    function getDiffDaysFromToday(s) {
      const p = parseDateParts(s);
      if (!p) return null;
      const now = new Date();
      const todayUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const targetUtc = Date.UTC(p.y, p.m - 1, p.d);
      return Math.round((targetUtc - todayUtc) / (24 * 3600 * 1000));
    }

    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function getPostStatusInfo(item, todayStr) {
      if (!todayStr) todayStr = getTodayStr();
      const isShipped = item.kind === "published" || item.is_published || item.status === "published";
      const res = item.result || item.published_result || "";

      if (isShipped) {
        if (res && res !== "unknown") {
          return {
            code: "reviewed",
            label: t("status_reviewed"),
            color: "#164673",
            bg: "#e8f1f8",
            border: "#bad5ec",
            dot: "🔵",
            badgeClass: "tag-reviewed"
          };
        }
        return {
          code: "published",
          label: t("status_published"),
          color: "#20572b",
          bg: "#eaf3ec",
          border: "#b7d8be",
          dot: "🟢",
          badgeClass: "tag-shipped"
        };
      }

      const schedDate = item.scheduled_date || (item.status === "scheduled" ? item.date : "");
      if (schedDate) {
        if (schedDate < todayStr) {
          return {
            code: "overdue",
            label: t("status_overdue"),
            color: "#9e2319",
            bg: "#fdeeed",
            border: "#f5c4c0",
            dot: "🔴",
            badgeClass: "tag-overdue"
          };
        }
        return {
          code: "scheduled",
          label: t("status_scheduled"),
          color: "#8a4f00",
          bg: "#fcf3e3",
          border: "#f1d8ab",
          dot: "🟠",
          badgeClass: "tag-sched"
        };
      }

      return {
        code: "draft",
        label: t("status_draft"),
        color: "#5c5549",
        bg: "#f0ebd9",

    function findRunNode(runId) {
      if (!runId) return null;
      if (byId[runId]) return byId[runId];
      if (byId["run:" + runId]) return byId["run:" + runId];
      const cleaned = runId.replace(/^run:/, "");
      return GRAPH.nodes.find(n => n.kind === "run" && (n.ident === cleaned || n.id === runId || n.id === "run:" + cleaned));
    }

    function getUnifiedCalendarItems() {
      const runs = nodesOf("run").filter(qmatch);
      const pubs = nodesOf("published").filter(qmatch);
      const items = [];
      const handledRunIds = new Set();
      const handledUrls = new Set();

      pubs.forEach(p => {
        const runId = p.run_id || "";
        const runNode = findRunNode(runId);
        if (runId) {
          const raw = runId.replace(/^run:/, "");
          handledRunIds.add(runId);
          handledRunIds.add(raw);
          handledRunIds.add("run:" + raw);
        }
        if (runNode) {
          handledRunIds.add(runNode.id);
          if (runNode.ident) handledRunIds.add(runNode.ident);
          if (runNode.published_url) handledUrls.add(runNode.published_url.trim());
        }
        if (p.url) handledUrls.add(p.url.trim());

        const dateStr = p.date || (runNode ? (runNode.published_date || runNode.date) : "") || "";
        const plat = (p.platform || (runNode ? runPlatform(runNode) : "") || "x").toLowerCase();
        const displayLabel = (runNode && runNode.label) ? runNode.label : (p.notes || p.ident || "已发帖");

        items.push({
          id: p.id,
          run_id: runNode ? runNode.id : (runId ? ("run:" + runId.replace(/^run:/, "")) : p.id),
          is_published: true,
          status: "published",
          result: p.result || (runNode ? runNode.published_result : "") || "unknown",
          date: dateStr,
          scheduled_date: "",
          platform: plat,
          label: displayLabel,
          url: p.url || (runNode ? runNode.published_url : ""),
          notes: p.notes || (runNode ? runNode.notes : "") || "",
          topic_id: p.topic_id || (runNode ? runNode.topic_id : ""),
          pillar: p.pillar || (runNode ? runNode.pillar : ""),
          profile: p.profile || (runNode ? (runNode.profile || runNode.account) : ""),
          raw: p,
          run_node: runNode
        });
      });

      runs.forEach(r => {
        const isPub = r.is_published || r.status === "published";
        if (handledRunIds.has(r.id) || (r.ident && handledRunIds.has(r.ident))) {
          return;
        }
        if (r.published_url && handledUrls.has(r.published_url.trim())) {
          return;
        }
        if (r.ship_urls && r.ship_urls.some(u => handledUrls.has(u.trim()))) {
          return;
        }

        const plat = (runPlatform(r) || "x").toLowerCase();
        const dateStr = (isPub ? (r.published_date || r.date) : (r.scheduled_date || r.date)) || "";

        items.push({
          id: r.id,
          run_id: r.id,
          is_published: isPub,
          status: r.status || (r.is_scheduled ? "scheduled" : "open"),
          result: r.published_result || "",
          date: dateStr,
          scheduled_date: r.scheduled_date || (r.status === "scheduled" ? r.date : ""),
          platform: plat,
          label: r.label || r.ident || "Run",
          url: r.published_url || "",
          notes: r.notes || "",
          topic_id: r.topic_id || "",
          pillar: r.pillar || "",
          profile: r.profile || r.account || "",
          raw: r,
          run_node: r
        });
      });

      return items;
    }

    function calculatePublishingStreaks(shippedDates, todayStr) {
      const sortedDates = Array.from(shippedDates).filter(Boolean).sort();
      let maxStreak = 0;
      let curRunningStreak = 0;
      let prevDate = null;

      sortedDates.forEach(dStr => {
        if (!prevDate) {
          curRunningStreak = 1;
        } else {
          const p1 = parseDateParts(prevDate);
          const p2 = parseDateParts(dStr);
          if (p1 && p2) {
            const d1 = new Date(Date.UTC(p1.y, p1.m - 1, p1.d));
            const d2 = new Date(Date.UTC(p2.y, p2.m - 1, p2.d));
            const diffDays = Math.round((d2 - d1) / (24 * 3600 * 1000));
            if (diffDays === 1) {
              curRunningStreak += 1;
            } else if (diffDays > 1) {
              curRunningStreak = 1;
            }
          }
        }
        if (curRunningStreak > maxStreak) {
          maxStreak = curRunningStreak;
        }
        prevDate = dStr;
      });

      let currentStreak = 0;
      let checkDate = new Date();
      let checkStr = todayStr;
      if (!shippedDates.has(checkStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
        checkStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
      }

      while (shippedDates.has(checkStr)) {
        currentStreak += 1;
        checkDate.setDate(checkDate.getDate() - 1);
        checkStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
      }

      return {
        totalActiveDays: sortedDates.length,
        maxStreak: maxStreak,
        currentStreak: currentStreak
      };
    }
